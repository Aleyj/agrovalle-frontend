<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17613d" />
    <meta name="description" content="AgroValle: lecturas agrícolas, historial y asistencia agronómica." />
    <title>AgroValle | Monitoreo agrícola</title>
    <script>
      try {
        const tema = localStorage.getItem('temaAgroValle');
        document.documentElement.dataset.tema = tema === 'light' || tema === 'dark'
          ? tema : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
